<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HERRAMIENTASTDAH - Editor, Captura y Unión PDF</title>
  <!-- Librerías para visualizar y combinar PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fondo gris general descansado */
    body {
      background-color: #555960;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra Superior con botones y letras grandes */
    .toolbar {
      background: #2f3238;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 2px solid #23252a;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    /* Botones y etiquetas de archivo grandes */
    button, label.btn-action {
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      border: 1px solid #4a4e57;
      background: #3e424a;
      color: #ffffff;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      transition: all 0.15s ease;
    }

    button:hover, label.btn-action:hover {
      background: #4f545f;
      transform: translateY(-1px);
    }

    button.active {
      background: #2563eb;
      border-color: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }

    .btn-open {
      background: #e65100;
      border-color: #e65100;
    }
    .btn-open:hover { background: #f57c00; }

    .btn-merge {
      background: #7b1fa2;
      border-color: #7b1fa2;
    }
    .btn-merge:hover { background: #8e24aa; }

    .btn-capture {
      background: #0284c7;
      border-color: #0284c7;
    }
    .btn-capture:hover { background: #0369a1; }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #f1f2f4;
    }

    input[type="range"] {
      width: 140px;
      height: 8px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .paginacion {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    .paginacion button {
      padding: 10px 16px;
      font-size: 16px;
    }

    /* Área de Trabajo gris neutra */
    .workspace {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      background: #626770;
    }

    .canvas-wrapper {
      position: relative;
      background: #ffffff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      border-radius: 6px;
    }

    #pdfCanvas {
      display: block;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <!-- Cargar PDF -->
    <label class="btn-action btn-open">
      📂 Abrir PDF
      <input type="file" id="fileInput" accept="application/pdf">
    </label>

    <!-- Unir varios PDFs -->
    <label class="btn-action btn-merge">
      📑 Unir varios PDFs
      <input type="file" id="mergeInput" accept="application/pdf" multiple>
    </label>

    <button id="btnPencil" class="active">✏️ Lápiz</button>
    <button id="btnEraser">🧼 Goma</button>
    <button id="btnCapture" class="btn-capture">📸 Captura TDAH</button>

    <div class="tool-group">
      <label>Grosor:</label>
      <input type="range" id="sizeRange" min="2" max="60" value="20">
      <span id="sizeVal">20px</span>
    </div>

    <div class="paginacion" style="margin-left: auto;">
      <button id="btnPrev">◀</button>
      <span id="pageInfo">0 / 0</span>
      <button id="btnNext">▶</button>
    </div>
  </div>

  <div class="workspace">
    <div class="canvas-wrapper" id="wrapper">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let totalPages = 0;
    const scale = 1.4;

    const pdfCanvas = document.getElementById('pdfCanvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');

    const fileInput = document.getElementById('fileInput');
    const mergeInput = document.getElementById('mergeInput');
    const btnPencil = document.getElementById('btnPencil');
    const btnEraser = document.getElementById('btnEraser');
    const btnCapture = document.getElementById('btnCapture');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const pageInfo = document.getElementById('pageInfo');
    const sizeRange = document.getElementById('sizeRange');
    const sizeVal = document.getElementById('sizeVal');

    let currentTool = 'pencil';
    let isDrawing = false;
    let startX = 0, startY = 0;
    let lastX = 0, lastY = 0;

    function setTool(tool) {
      currentTool = tool;
      btnPencil.classList.toggle('active', tool === 'pencil');
      btnEraser.classList.toggle('active', tool === 'eraser');
      btnCapture.classList.toggle('active', tool === 'capture');
    }

    btnPencil.onclick = () => setTool('pencil');
    btnEraser.onclick = () => setTool('eraser');
    btnCapture.onclick = () => setTool('capture');

    sizeRange.oninput = (e) => { sizeVal.textContent = e.target.value + 'px'; };

    // Abrir PDF
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(ev) {
        const loadingTask = pdfjsLib.getDocument(new Uint8Array(ev.target.result));
        loadingTask.promise.then(pdf => {
          pdfDoc = pdf;
          totalPages = pdf.numPages;
          pageNum = 1;
          renderPage(pageNum);
        });
      };
      reader.readAsArrayBuffer(file);
    };

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: scale });

        pdfCanvas.height = viewport.height;
        pdfCanvas.width = viewport.width;
        drawCanvas.height = viewport.height;
        drawCanvas.width = viewport.width;

        pageInfo.textContent = `${num} / ${totalPages}`;

        const renderContext = { canvasContext: pdfCtx, viewport: viewport };
        page.render(renderContext);
      });
    }

    btnPrev.onclick = () => { if (pdfDoc && pageNum > 1) { pageNum--; renderPage(pageNum); } };
    btnNext.onclick = () => { if (pdfDoc && pageNum < totalPages) { pageNum++; renderPage(pageNum); } };

    // Unir varios PDFs
    mergeInput.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (files.length < 2) {
        alert("Selecciona al menos 2 archivos PDF para unirlos.");
        return;
      }

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const file of files) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
          const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }

        const mergedPdfFile = await mergedPdf.save();
        const blob = new Blob([mergedPdfFile], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'PDF_Unificado.pdf';
        link.click();
      } catch (err) {
        alert('Error al unir los PDFs: ' + err.message);
      }
    };

    function getPos(e) {
      const r = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - r.left, y: clientY - r.top };
    }

    function startDraw(e) {
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      lastX = pos.x;
      lastY = pos.y;
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPos(e);

      if (currentTool === 'pencil' || currentTool === 'eraser') {
        drawCtx.beginPath();
        drawCtx.moveTo(lastX, lastY);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';

        if (currentTool === 'pencil') {
          drawCtx.strokeStyle = '#000000';
          drawCtx.lineWidth = sizeRange.value;
        } else {
          drawCtx.strokeStyle = '#ffffff';
          drawCtx.lineWidth = sizeRange.value * 2;
        }
        drawCtx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }
    }

    function endDraw(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const pos = getPos(e);

      if (currentTool === 'capture') {
        const x = Math.min(startX, pos.x);
        const y = Math.min(startY, pos.y);
        const w = Math.abs(pos.x - startX);
        const h = Math.abs(pos.y - startY);

        if (w < 10 || h < 10) return;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w;
        cropCanvas.height = h;
        const cropCtx = cropCanvas.getContext('2d');

        cropCtx.drawImage(pdfCanvas, x, y, w, h, 0, 0, w, h);
        cropCtx.drawImage(drawCanvas, x, y, w, h, 0, 0, w, h);

        const link = document.createElement('a');
        link.download = `captura_tdah_pag_${pageNum}.png`;
        link.href = cropCanvas.toDataURL('image/png');
        link.click();
      }
    }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', endDraw);

    drawCanvas.addEventListener('touchstart', startDraw, { passive: true });
    drawCanvas.addEventListener('touchmove', draw, { passive: true });
    window.addEventListener('touchend', endDraw);
  </script>
</body>
</html>
